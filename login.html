<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MikroTik Voucher Generator</title>
<style>
         * { box-sizing: border-box; margin: 0; padding: 0; }
         body { font-family: Arial, Helvetica, sans-serif; background-color: #3d4044; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
         .login-container { max-width: 400px; width: 100%; padding: 0 15px; }
         .card { background-color: #191e2d; border-radius: 5px; padding: 30px; box-shadow: 0 0 2px #000; }
         .form-group { margin: 15px 0; }
         label { display: block; margin: 5px 0; font-size: 14px; color: #fff; }
         input { width: 100%; padding: 12px; background-color: #191e2d; border: 2px solid #485460; border-radius: 5px; color: white; font-size: 16px; }
         input:focus { outline: none; border-color: dodgerblue; }
         .btn { background-color: dodgerblue; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 20px; }
         .btn:hover { background-color: royalblue; }
         .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
         .link { text-align: center; margin-top: 20px; }
         .link a { color: dodgerblue; text-decoration: none; }
         .link a:hover { text-decoration: underline; }
         .checkbox-container { display: flex; align-items: center; margin-top: 5px; }
         .checkbox-container input[type="checkbox"] { width: auto; margin-right: 8px; }
         .checkbox-container label { color: #aaa; font-size: 12px; margin: 0; }
     </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <h1 style="text-align: center;"><img src="img/logo.png" alt="Logo" style="width: 200px; height: auto; margin: 40px 0 40px 0;"></h1>
            <div id="error" class="error"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <div class="checkbox-container">
                        <input type="checkbox" id="showPassword" onchange="togglePassword()">
                        <label for="showPassword">Show Password</label>
                    </div>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="link">
                <a href="register.html">Register</a>
            </div>
        </div>
    </div>
<script>
var ActivitiesDB = (function() {
    var ACTIVITIES_KEY = 'voucherActivities';
    var PASSWORD_KEY = 'appPassword';
    
    var defaultPassword = 'admin123';
    
    function generateSalt() {
        var array = new Uint8Array(16);
        window.crypto.getRandomValues(array);
        return Array.from(array, function(byte) { return byte.toString(16).padStart(2, '0'); }).join('');
    }
    
    function hashPassword(password, salt) {
        var saltedPassword = password + salt;
        var hash = 0;
        for (var i = 0; i < saltedPassword.length; i++) {
            var char = saltedPassword.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        var hashStr = (hash >>> 0).toString(16);
        var extraHash = 0;
        for (var i = 0; i < salt.length; i++) {
            var char = salt.charCodeAt(i);
            extraHash = ((extraHash << 5) - extraHash) + char;
            extraHash = extraHash & extraHash;
        }
        return hashStr + extraHash.toString(16).padStart(8, '0');
    }
    
    function init() {
        if (!localStorage.getItem(PASSWORD_KEY)) {
            var salt = generateSalt();
            var hashedPass = hashPassword(defaultPassword, salt);
            localStorage.setItem(PASSWORD_KEY, JSON.stringify({ hash: hashedPass, salt: salt }));
        }
        if (!localStorage.getItem(ACTIVITIES_KEY)) {
            localStorage.setItem(ACTIVITIES_KEY, JSON.stringify([]));
        }
    }
    
    function validatePassword(password) {
        var stored = localStorage.getItem(PASSWORD_KEY);
        if (!stored) return false;
        var data = JSON.parse(stored);
        var hashedInput = hashPassword(password, data.salt);
        return hashedInput === data.hash;
    }
    
    function logActivity(type, description, details) {
        var activities = JSON.parse(localStorage.getItem(ACTIVITIES_KEY) || '[]');
        var user = sessionStorage.getItem('username') || 'anonymous';
        activities.push({
            id: Date.now() + Math.random().toString(36).substr(2, 5),
            type: type,
            user: user,
            description: description,
            details: details || {},
            timestamp: new Date().toISOString()
        });
        localStorage.setItem(ACTIVITIES_KEY, JSON.stringify(activities));
    }
    
    function getActivities() {
        return JSON.parse(localStorage.getItem(ACTIVITIES_KEY) || '[]');
    }
    
    return {
        init: init,
        validatePassword: validatePassword,
        logActivity: logActivity,
        getActivities: getActivities
    };
})();

document.addEventListener('DOMContentLoaded', function() {
    ActivitiesDB.init();
});

document.getElementById('loginForm').addEventListener('submit', function(e) {
             e.preventDefault();
             var username = document.getElementById('username').value.trim();
             var password = document.getElementById('password').value;
             var errorDiv = document.getElementById('error');
             errorDiv.style.display = 'none';
 
             var users = JSON.parse(localStorage.getItem('users') || '{}');
             
 var storedAdminPass = localStorage.getItem('adminPassword') || 'password';
              var authenticated = false;
              
 if (username === 'admin' && password === storedAdminPass) {
                   authenticated = true;
               } else if (users[username]) {
                 var userData = users[username];
                 if (typeof userData === 'object' && userData.password === password) {
                     authenticated = true;
                 } else if (userData === password) {
                     authenticated = true;
                 }
             }
             
 if (authenticated) {
              sessionStorage.setItem('authenticated', 'true');
              sessionStorage.setItem('username', username);
              ActivitiesDB.logActivity('user_login', 'User logged in', { username: username });
              window.location.href = 'index.html';
          } else {
                 ActivitiesDB.logActivity('login_failed', 'Failed login attempt', { username: username });
                 errorDiv.textContent = 'Invalid username or password';
                 errorDiv.style.display = 'block';
             }
         });

if (sessionStorage.getItem('authenticated') === 'true') {
             window.location.href = 'index.html';
         }
         
function togglePassword() {
              var pwd = document.getElementById('password');
              var checkbox = document.getElementById('showPassword');
              pwd.type = checkbox.checked ? 'text' : 'password';
          }
     </script>
</body>
</html>
